name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rescomail
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rescomail
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-that-is-long-enough-for-better-auth
      AI_SERVICE_URL: http://localhost:8000
      DATA_ENCRYPTION_KEY: e4a7b9c2d5f8103649a2b7c5d8e1f0a3
      AI_SERVICE_API_KEY: 8mwOV1PmLGSsMhSsCFlXmMKNYOYovKbF
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db db:migrate
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm --filter web test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen pytest --cov=app --cov-report=term-missing
