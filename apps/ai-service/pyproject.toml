[project]
name = "rescomail-ai-service"
version = "0.1.0"
description = "Rescomail AI Service — Resume parsing, ATS analysis, cold mail generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "pydantic==2.11.5",
    "pydantic-settings>=2.3.0",
    "requests==2.32.3",
    "python-dotenv==1.1.0",
    "PyMuPDF==1.25.5",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "resend>=0.7.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
