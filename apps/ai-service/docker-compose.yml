# =============================================================================
# Rescomail AI Service — docker-compose.yml
# Local development: API server only (stateless — no Redis, no Celery)
#
# Usage:
#   docker-compose up --build
# =============================================================================

version: "3.9"

services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app  # Hot-reload for local dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
